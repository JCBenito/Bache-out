<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mi perfil | Bache-Out Administrador</title>

    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/administrador.css">
</head>

<body data-pag="administrador">

<main>
    <div class="card profile">

        <div class="p-head">
            <div class="avatar" id="pAv" aria-hidden="true">AD</div>

            <div>
                <h2 id="pTitulo">Administrador</h2>
                <p id="pSub">Administrador del sistema</p>
            </div>
        </div>

        <div class="pgrid">

            <!-- Nombre(s) -->
            <div>
                <label for="pNombres">Nombre(s)</label>
                <input
                    id="pNombres"
                    type="text"
                    minlength="3"
                    maxlength="50"
                    required
                    disabled
                    autocomplete="given-name"
                >
                <div class="err" data-err="nombres"></div>
            </div>

            <!-- Apellido paterno -->
            <div>
                <label for="pPaterno">Apellido paterno</label>
                <input
                    id="pPaterno"
                    type="text"
                    minlength="3"
                    maxlength="50"
                    required
                    disabled
                    autocomplete="family-name"
                >
                <div class="err" data-err="paterno"></div>
            </div>

            <!-- Apellido materno -->
            <div>
                <label for="pMaterno">Apellido materno</label>
                <input
                    id="pMaterno"
                    type="text"
                    minlength="3"
                    maxlength="50"
                    required
                    disabled
                >
                <div class="err" data-err="materno"></div>
            </div>

            <!-- Correo -->
            <div>
                <label for="pCorreo">Correo electrónico</label>
                <input
                    id="pCorreo"
                    type="email"
                    required
                    readonly
                    autocomplete="email"
                >
                <div class="err" data-err="correo"></div>
            </div>

            <!-- Teléfono -->
            <div>
                <label for="pTel">Teléfono</label>
                <input
                    id="pTel"
                    type="tel"
                    inputmode="numeric"
                    maxlength="10"
                    minlength="10"
                    pattern="[0-9]{10}"
                    required
                    disabled
                    autocomplete="tel"
                    placeholder="10 dígitos"
                >
                <div class="err" data-err="tel"></div>
            </div>

            <!-- Cargo -->
            <div>
                <label for="pCargo">Cargo</label>

                <select id="pCargo" required disabled>
                    <option value="">Selecciona un cargo</option>
                    <option value="Project Manager / Scrum Master">
                        Project Manager / Scrum Master
                    </option>
                    <option value="Responsable de Frontend">
                        Responsable de Frontend
                    </option>
                    <option value="Responsable de Backend">
                        Responsable de Backend
                    </option>
                    <option value="Administrador de Base de Datos">
                        Administrador de Base de Datos
                    </option>
                </select>

                <div class="err" data-err="cargo"></div>
            </div>

        </div>

        <div class="p-actions">
            <button class="btn out" id="pSalir">Cerrar sesión</button>
            <button class="btn ghost" id="pCancelar" hidden>Cancelar</button>
            <button class="btn" id="pGuardar" hidden>Guardar cambios</button>
            <button class="btn" id="pEditar">Editar perfil</button>
        </div>

    </div>

    <dialog id="dSalir">
        <h3>¿Cerrar sesión?</h3>

        <p style="color:var(--muted);margin:8px 0 18px">
            Tendrás que volver a ingresar tu correo y contraseña para entrar.
        </p>

        <div class="row">
            <button class="btn ghost" id="sNo">Cancelar</button>
            <button class="btn" id="sSi">Cerrar sesión</button>
        </div>
    </dialog>

</main>

<script src="js/comun.js"></script>
<script src="js/administrador.js"></script>

</body>
</html>

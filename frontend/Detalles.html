<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bache-Out | Mis reportes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/detalles.css">

</head>


<body>


    <!-- =========================================
         ENCABEZADO
    ========================================= -->

    <header class="barra-principal">

        <div class="marca">

            <img src="Img/Logo.png" alt="Logo de Bache-Out" class="logo">
            <span>Bache-Out</span>

        </div>

    </header>



    <!-- =========================================
         BARRA DE NAVEGACIÓN
    ========================================= -->

    <nav class="barra-navegacion">
        <a href="nosotros.html">Nosotros</a>
        <a href="index.html"> Inicio </a>
        <a href="Reporte.html">Reportar bache</a>
        <a href="Detalles.html" class="activo">Mis reportes </a>
        <a href="mapa.html"> Mapa interactivo</a>
        <a href="Perfil.html"> Mi perfil </a>

    </nav>



    <!-- =========================================
         CONTENIDO PRINCIPAL
    ========================================= -->

    <main class="pagina-reportes">


        <!-- =========================================
             ENCABEZADO
        ========================================= -->

        <section class="encabezado-reportes">

            <span class="etiqueta-reportes">
               CONSULTAR BACHE
            </span>

            <h1>
                Historial de reportes
            </h1>

            <p>
                Consulta los reportes que has realizado
                y revisa el estado actual de cada uno.
            </p>

        </section>

        <!-- =========================================
    RESUMEN DE REPORTES
========================================= -->

<section class="resumen-reportes">

    <div class="contador-reporte total">
        <span class="numero" id="totalReportes">0</span>
        <span class="texto">Total de reportes</span>
    </div>

    <div class="contador-reporte pendiente">
        <span class="numero" id="totalPendientes">0</span>
        <span class="texto">Pendientes</span>
    </div>

    <div class="contador-reporte reparando">
        <span class="numero" id="totalReparando">0</span>
        <span class="texto">En reparación</span>
    </div>

    <div class="contador-reporte resuelto">
        <span class="numero" id="totalResueltos">0</span>
        <span class="texto">Resueltos</span>
    </div>

    

</section>



<!-- =========================================
     FILTRO DE REPORTES
========================================= -->

<section class="filtro-reportes">

    <label for="filtroEstado">
        Filtrar por estado:
    </label>

    <select id="filtroEstado">

        <option value="todos">
            Todos los reportes
        </option>

        <option value="pendiente">
            Pendientes
        </option>

        <option value="reparando">
            En reparación
        </option>

        <option value="resuelto">
            Resueltos
        </option>

        <option value="cancelado">
            Cancelados
        </option>

    </select>

</section>



        <!-- =========================================
             LISTA DE REPORTES (DINÁMICA)
        ========================================= -->

        <section class="lista-reportes" id="contenedorReportes">
            <!-- Los reportes se cargarán automáticamente aquí mediante JavaScript -->
            <p style="text-align: center; padding: 20px; color: #7b898e;">Cargando tus reportes...</p>
        </section>

    </main>



    <!-- =========================================
         PROTECCIÓN DE SESIÓN Y CARGA DE REPORTES
    ========================================= -->

    <script>
        // 1. Proteger la ruta si no hay sesión iniciada
        if (sessionStorage.getItem("sesionIniciada") !== "true") {
            window.location.href = "login.html";
        }
    </script>

    <script src="js/detalles.js"></script>

</body>

</html>

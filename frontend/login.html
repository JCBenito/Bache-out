<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bache-Out | Iniciar sesión</title>

    <!-- Ruta absoluta con diagonal inicial para asegurar que Express/Render cargue el CSS -->
    <link rel="stylesheet" href="/css/login.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- CONTENEDOR PRINCIPAL (#login) QUE APLICA EL FONDO MENTA Y CENTRA LA TARJETA -->
    <main id="login">

        <!-- TARJETA DE LOGIN (.lcard) -->
        <section class="lcard">

            <!-- LOGOTIPO Y MARCA -->
            <div class="logo">
                <img src="/Img/Logo.png" alt="Logo de Bache-Out" style="width: 32px; height: 32px;">
                <span>Bache-Out</span>
            </div>

            <!-- TÍTULO Y SUBTÍTULO -->
            <h1>Iniciar sesión</h1>
            <p class="sub">Ingresa a tu cuenta para continuar</p>

            <!-- FORMULARIO -->
            <form id="formularioLogin">

                <!-- CORREO O TELÉFONO -->
                <div class="campo">
                    <label for="usuario">Correo electrónico o número telefónico</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Correo o número telefónico"
                        required
                    >
                </div>

                <!-- CONTRASEÑA -->
                <div class="campo">
                    <label for="password">Contraseña</label>
                    
                    <!-- Contenedor con clase .pw para posicionar el botón "Mostrar" -->
                    <div class="pw">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            required
                        >
                        <button
                            type="button"
                            id="mostrarPassword"
                        >
                            Mostrar
                        </button>
                    </div>
                </div>

                <!-- RECUPERAR CONTRASEÑA -->
                <button type="button" class="forgot" onclick="window.location.href='recuperar.html'">
                    ¿Olvidaste tu contraseña?
                </button>

                <!-- MENSAJE DE ERROR / ÉXITO (.lmsg) -->
                <p id="mensaje" class="lmsg"></p>

                <!-- BOTÓN DE INICIO DE SESIÓN (.lbtn) -->
                <button
                    type="submit"
                    class="lbtn"
                >
                    Iniciar sesión
                </button>

            </form>

            <!-- PIE DE TARJETA / REGISTRO (.lfoot) -->
            <div class="lfoot">
                <p>
                    ¿No tienes una cuenta?
                    <a href="Registro.html" style="color: #0f8190; font-weight: 700; text-decoration: none;">Crear cuenta</a>
                </p>
            </div>

        </section>

    </main>

    <!-- JAVASCRIPT CON RUTA ABSOLUTA -->
    <script src="/js/login.js"></script>

</body>

</html>

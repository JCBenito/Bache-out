<!DOCTYPE html>
<html lang="es">
<head> m
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi perfil | Bache-Out Administrador</title>
<link rel="stylesheet" href="css/comun.css">
<link rel="stylesheet" href="css/administrador.css">
<script>(function(){var s=null;try{s=sessionStorage.getItem("bo_sesion")}catch(e){}if(!s&&/(^|;)bo_sesion=/.test(window.name))s=1;if(!s){document.documentElement.style.display="none";location.replace("login.html")}})()</script>
</head>
<body data-pag="administrador">
<main>
  <div class="card profile">
    <div class="p-head">
      <div class="avatar" id="pAv" aria-hidden="true">AD</div>
      <div><h2 id="pTitulo">Administrador</h2><p id="pSub">Administrador del sistema</p></div>
    </div>
    <div class="pgrid">
      <div><label for="pNombre">Nombre completo</label><input id="pNombre" disabled autocomplete="name"><div class="err" data-err="nombre"></div></div>
      <div><label for="pCorreo">Correo electrónico</label><input id="pCorreo" type="email" disabled autocomplete="email"><div class="err" data-err="correo"></div></div>
      <div><label for="pTel">Teléfono</label><input id="pTel" type="tel" disabled autocomplete="tel"><div class="err" data-err="tel"></div></div>
      <div><label for="pCargo">Cargo</label><input id="pCargo" disabled></div>
    </div>
    <div class="p-actions">
      <button class="btn out" id="pSalir">Cerrar sesión</button>
      <button class="btn ghost" id="pCancelar" hidden>Cancelar</button>
      <button class="btn" id="pGuardar" hidden>Guardar cambios</button>
      <button class="btn" id="pEditar">Editar perfil</button>
    </div>
  </div>
  <dialog id="dSalir">
    <h3>¿Cerrar sesión?</h3>
    <p style="color:var(--muted);margin:8px 0 18px">Tendrás que volver a ingresar tu correo y contraseña para entrar.</p>
    <div class="row"><button class="btn ghost" id="sNo">Cancelar</button><button class="btn" id="sSi">Cerrar sesión</button></div>
  </dialog>
</main>
<script src="js/comun.js"></script>
<script src="js/administrador.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bache-Out | Crear cuenta</title>

    <link rel="stylesheet" href="css/registro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="barra-principal">

        <div class="marca">
            <img src="img/Logo.png" alt="Logo de Bache-Out" class="logo">
            <span>Bache-Out</span>
        </div>


    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="registro-pagina">

        <section class="registro-tarjeta">

           
            <div class="registro-titulo">

                <h1>Crear cuenta</h1>

                <p>
                    Completa tus datos para registrarte
                </p>

            </div>


            <!-- FORMULARIO -->
            <form id="formularioRegistro">

                <!-- NOMBRE Y APELLIDOS -->
                <div class="fila">

                    <div class="campo">

                        <label for="nombre">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Ingresa tu nombre"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="apellidosP">
                            Apellido Paterno
                        </label>

                        <input
                            type="text"
                            id="apellidoP"
                            name="apellidoP"
                            placeholder="Ingresa tu apellido Paterno"
                            required
                        >
                    </div>

                    <div class="campo">

                        <label for="apellidoM">
                            Apellido Materno
                        </label>

                        <input
                            type="text"
                            id="apellidoM"
                            name="apellidoM"
                            placeholder="Ingresa tu apellido Materno"
                            required
                        >

                    </div>

                </div>


                <!-- CORREO -->
                <div class="campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required
                    >

                </div>


                <!-- TELÉFONO -->
                <div class="campo">

                    <label for="telefono">
                        Número telefónico
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="10 dígitos"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- CONTRASEÑA -->
                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="password-contenedor">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Crea una contraseña"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarPassword"
                        >
                            Mostrar
                        </button>

                    </div>

                </div>


                <!-- CONFIRMAR CONTRASEÑA -->
                <div class="campo">

                    <label for="confirmarPassword">
                        Confirmar contraseña
                    </label>

                    <div class="password-contenedor">

                        <input
                            type="password"
                            id="confirmarPassword"
                            name="confirmarPassword"
                            placeholder="Repite tu contraseña"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarConfirmar"
                        >
                            Mostrar
                        </button>

                    </div>

                </div>


                <!-- REGLAS DE CONTRASEÑA -->
                <div class="reglas-password">

                    <p>La contraseña debe contener:</p>

                    <ul>
                        <li>Mínimo 8 caracteres</li>
                        <li>Al menos un número</li>
                        <li>Al menos un símbolo, por ejemplo: ! @ # $ %</li>
                    </ul>

                </div>


                <!-- TÉRMINOS -->
                <div class="terminos">

                    <label>

                        <input
                            type="checkbox"
                            id="terminos"
                            name="terminos"
                            required
                        >

                        <span>
                            Acepto los términos y condiciones de Bache-Out.
                        </span>

                    </label>

                </div>


                <!-- MENSAJE DE ERROR O ÉXITO -->
                <p
                    id="mensaje"
                    class="mensaje"
                ></p>


                <!-- BOTÓN -->
                <button
                    type="submit"
                    class="btn-crear"
                >
                    Crear cuenta
                </button>

            </form>


            <!-- INICIAR SESIÓN -->
            <div class="iniciar-sesion">

                <p>
                    ¿Ya tienes una cuenta?

                    <a href="login.html">
                        Iniciar sesión
                    </a>
                </p>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="js/registro.js"></script>

</body>

</html>

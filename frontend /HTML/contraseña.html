<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bache-Out | Nueva contraseña</title>

    <link rel="stylesheet" href="css/contraseña.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="barra-principal">

        <div class="marca">

            <img
                src="img/Logo.png"
                alt="Logo de Bache-Out"
                class="logo"
            >

            <span>Bache-Out</span>

        </div>

    </header>


    <!-- CONTENIDO -->
    <main class="contenedor-nueva">

        <section class="tarjeta-nueva">

            <span class="etiqueta">
                RECUPERACIÓN
            </span>


            <h1>
                Nueva contraseña
            </h1>


            <p class="descripcion">
                Crea una nueva contraseña para recuperar
                el acceso a tu cuenta de Bache-Out.
            </p>


            <!-- FORMULARIO -->
            <form id="formularioNueva">


                <!-- NUEVA CONTRASEÑA -->
                <div class="campo">

                    <label for="nuevaContrasena">
                        Nueva contraseña
                    </label>

                    <input
                        type="password"
                        id="nuevaContrasena"
                        placeholder="Ingresa tu nueva contraseña"
                        required
                    >

                </div>


                <!-- CONFIRMAR CONTRASEÑA -->
                <div class="campo">

                    <label for="confirmarContrasena">
                        Confirmar nueva contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmarContrasena"
                        placeholder="Confirma tu nueva contraseña"
                        required
                    >

                    <small id="mensajeError"></small>

                </div>


                <!-- REGLAS DE CONTRASEÑA -->
                <div class="reglas">

                    <p>
                        La contraseña debe tener:
                    </p>

                    <ul>

                        <li>
                            Mínimo 8 caracteres
                        </li>

                        <li>
                            Al menos un número
                        </li>

                        <li>
                            Al menos un símbolo
                        </li>

                    </ul>

                </div>


                <!-- BOTÓN -->
                <button
                    type="submit"
                    class="btn-guardar"
                >
                    Guardar nueva contraseña
                </button>

            </form>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="js/contraseña.js"></script>

</body>

</html>

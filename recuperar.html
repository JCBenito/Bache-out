<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Bache-Out</title>

    <link rel="stylesheet" href="/css/recueperar.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="barra-principal">

        <div class="marca">
            <img src="img/Logo.png" alt="Logo de Bache-Out" class="logo">

            <span>Bache-Out</span>
        </div>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="recuperar-container">

        <section class="recuperar-card">

            <h1>Recuperar contraseña</h1>

            <p class="descripcion">
                Ingresa tu correo electrónico o número telefónico
                para recuperar el acceso a tu cuenta.
            </p>

            <form id="recuperarForm">

                <div class="form-group">

                    <label for="usuario">
                        Correo electrónico o número telefónico
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu correo o teléfono"
                    >

                    <span id="errorUsuario" class="error"></span>

                </div>

                <button type="submit" class="btn-recuperar">
                    Continuar
                </button>

            </form>

            <p class="volver">
                ¿Recordaste tu contraseña?
                <a href="login.html">Iniciar sesión</a>
            </p>

        </section>

    </main>


    <!-- VENTANA EMERGENTE -->
    <div id="modalRecuperacion" class="modal">

        <div class="modal-content">

            <h2>Solicitud enviada</h2>

            <p>
                Si los datos ingresados corresponden a una cuenta,
                recibirás las instrucciones para recuperar tu contraseña.
            </p>

            <button id="cerrarModal">
                Aceptar
            </button>

        </div>

    </div>


    <script src="/js/recuperar.js"></script>

</body>
</html>
